<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.json"><title>Employee Entry - Pro V23A</title><style>
:root{--blue:#1769aa;--ink:#17212b;--bg:#f3f6f8;--ok:#ecfdf3;--err:#fff1f0}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:16px}
.card,.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001;margin-top:12px}
input,select,button{padding:11px;border:1px solid #ccd3da;border-radius:9px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}
.ok{background:var(--ok);padding:10px;border-radius:8px;margin-top:10px}.err{background:var(--err);padding:10px;border-radius:8px;margin-top:10px}.muted{color:#667085;font-size:14px}
.wrap{max-width:760px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{width:100%}.ins{margin-top:12px;padding-top:12px;border-top:1px solid #eee}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h2>Employee Daily Entry</h2><div class="card"><div class="grid"><input id="date" type="date"><input id="ecode" placeholder="Employee Code"><select id="shift"><option value="">Shift</option><option>A</option><option>B</option><option>C</option></select><input id="machine" placeholder="Machine"><input id="job" placeholder="Job Name"><input id="cycle" type="number" step="0.01" placeholder="Cycle Time (min/job)"><input id="hours" type="number" step="0.01" value="7" placeholder="Shift Hours"><input id="actual" type="number" placeholder="Actual Jobs"><input id="company" placeholder="Company"></div><div id="inserts"></div><button onclick="submitLog()" style="margin-top:14px">Submit Daily Entry</button><div id="msg"></div><p><a href="./index.html">← Home</a></p></div></div><script>
const DBKEY='cnc_v23a_db';
function dbLoad(){try{return JSON.parse(localStorage.getItem(DBKEY))||{employees:[],logs:[],settings:{username:'admin',password:'1234'}}}catch(e){return {employees:[],logs:[],settings:{username:'admin',password:'1234'}}}}
function dbSave(db){localStorage.setItem(DBKEY,JSON.stringify(db))}
function clean(v){return String(v||'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayLocal(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function requireAdmin(){if(sessionStorage.getItem('cnc_v23a_admin')!=='1'){location='./login.html';return false}return true}

date.value=todayLocal();
for(let i=1;i<=6;i++)inserts.innerHTML+=`<div class="ins"><b>Insert ${i}</b><div class="grid"><input id="ic${i}" placeholder="Insert Code"><input id="iq${i}" type="number" placeholder="Used Qty"><input id="ij${i}" type="number" placeholder="Jobs Run"></div></div>`;
function submitLog(){const db=dbLoad(),code=clean(ecode.value),emp=db.employees.find(e=>e.employee_code===code&&e.active!==false);if(!date.value||!code||!clean(machine.value))return show('Date, Employee Code, Machine required',false);if(!emp)return show('Invalid employee code. Admin முதலில் employee add செய்ய வேண்டும்.',false);const ins=[];for(let i=1;i<=6;i++){const c=clean(document.getElementById('ic'+i).value),q=+document.getElementById('iq'+i).value||0,j=+document.getElementById('ij'+i).value||0;if(c&&(q||j))ins.push({code:c,qty:q,jobs:j})}db.logs.push({id:Date.now(),log_date:date.value,employee_name:emp.name,employee_phone:emp.phone,employee_code:emp.employee_code,shift:shift.value,machine:clean(machine.value),job_name:clean(job.value),cycle_time:+cycle.value||0,shift_hours:+hours.value||7,actual_jobs:+actual.value||0,company:clean(company.value),inserts:ins,created_at:new Date().toISOString()});dbSave(db);show(`Entry saved - ${emp.name}`,true)}
function show(t,ok){msg.className=ok?'ok':'err';msg.textContent=t}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=23a-20260814-r2',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}</script></body></html>
