<!doctype html><html><head><meta name="theme-color" content="#16324f"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Entry - Pro V21</title><style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#18212a}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border-radius:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{padding:12px;border:1px solid #ccd3da;border-radius:9px;width:100%;box-sizing:border-box}
button{background:#1769aa;color:#fff;border:0;font-weight:bold}.ins{margin-top:12px;padding-top:12px;border-top:1px solid #eee}.ok{background:#ecfdf3;padding:10px;border-radius:8px;margin-top:10px}.err{background:#fff1f0;padding:10px;border-radius:8px;margin-top:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><button id="installAppBtn" onclick="installApp()" style="display:none;position:fixed;right:10px;bottom:10px;z-index:99;padding:10px 14px;background:#f4b942;border:0;border-radius:10px;font-weight:bold">Install Employee App</button><div class="wrap"><h2>Employee Daily Entry</h2><div class="card">
<div class="grid">
<input id="date" type="date"><input id="ecode" placeholder="Employee Code">
<select id="shift"><option value="">Shift</option><option>A</option><option>B</option><option>C</option></select>
<input id="machine" placeholder="Machine"><input id="job" placeholder="Job Name">
<input id="cycle" type="number" step="0.01" placeholder="Cycle Time (min/job)"><input id="hours" type="number" step="0.01" value="7" placeholder="Shift Hours">
<input id="actual" type="number" placeholder="Actual Jobs"><input id="company" placeholder="Company">
</div><div id="inserts"></div><button onclick="submitLog()" style="margin-top:14px">Submit Daily Entry</button><div id="msg"></div>
</div></div><script>
date.value=new Date().toISOString().slice(0,10);
const box=document.getElementById('inserts');for(let i=1;i<=6;i++)box.innerHTML+=`<div class="ins"><b>Insert ${i}</b><div class="grid"><input id="ic${i}" placeholder="Insert Code"><input id="iq${i}" type="number" placeholder="Used Qty"><input id="ij${i}" type="number" placeholder="Jobs Run"></div></div>`;
async function submitLog(){
 const inserts=[];for(let i=1;i<=6;i++){const code=document.getElementById('ic'+i).value.trim(),qty=+document.getElementById('iq'+i).value||0,jobs=+document.getElementById('ij'+i).value||0;if(code&&(qty||jobs))inserts.push({code,qty,jobs})}
 const payload={log_date:date.value,employee_code:ecode.value.trim(),shift:shift.value,machine:machine.value.trim(),job_name:job.value.trim(),cycle_time:+cycle.value||0,shift_hours:+hours.value||7,actual_jobs:+actual.value||0,company:company.value.trim(),inserts};
 const r=await fetch('/api/logs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();
 msg.className=r.ok?'ok':'err';msg.textContent=r.ok?`Entry submitted - ${d.employee_name}`:(d.error||'Error');
}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById('installAppBtn'); if(b)b.style.display='inline-block';
});
async function installApp(){
  if(!deferredPrompt){alert('Chrome menu > Add to Home screen / Install app பயன்படுத்தவும்.');return;}
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null;
}
</script>
</body></html>
