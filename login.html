<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.json"><title>Admin Login</title><style>
:root{--blue:#1769aa;--ink:#17212b;--bg:#f3f6f8;--ok:#ecfdf3;--err:#fff1f0}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:16px}
.card,.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001;margin-top:12px}
input,select,button{padding:11px;border:1px solid #ccd3da;border-radius:9px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}
.ok{background:var(--ok);padding:10px;border-radius:8px;margin-top:10px}.err{background:var(--err);padding:10px;border-radius:8px;margin-top:10px}.muted{color:#667085;font-size:14px}
.box{max-width:380px;margin:70px auto}input,button{width:100%;margin:7px 0}</style></head><body><div class="box card"><h2>Admin Login</h2><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="go()">Login</button><div id="m"></div><p class="muted">முதல் login: admin / 1234. Login ஆனதும் password மாற்றலாம்.</p><p><a href="./index.html">← Home</a></p></div><script>
const DBKEY='cnc_v23a_db';
function dbLoad(){try{return JSON.parse(localStorage.getItem(DBKEY))||{employees:[],logs:[],settings:{username:'admin',password:'1234'}}}catch(e){return {employees:[],logs:[],settings:{username:'admin',password:'1234'}}}}
function dbSave(db){localStorage.setItem(DBKEY,JSON.stringify(db))}
function clean(v){return String(v||'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayLocal(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function requireAdmin(){if(sessionStorage.getItem('cnc_v23a_admin')!=='1'){location='./login.html';return false}return true}

function go(){const db=dbLoad();if(clean(u.value)===db.settings.username && p.value===db.settings.password){sessionStorage.setItem('cnc_v23a_admin','1');location='./admin.html'}else{m.className='err';m.textContent='Invalid login'}}
p.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
